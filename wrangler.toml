#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages — runtime configuration (next-on-pages adapter).
#
# The adapter writes its build output to `.vercel/output`; `pages:deploy`
# uploads that directory. Framework versions stay pinned in package.json
# (Next 14.2.15 / React 18.3.1) — do not float them.

name = "mindinbox-final"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Cloudflare Pages injects these into the Edge runtime automatically.
# Declaring them here documents the contract and keeps `wrangler dev` honest.
[vars]
NEXT_PUBLIC_FIREBASE_API_KEY = ""
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = ""
NEXT_PUBLIC_FIREBASE_PROJECT_ID = ""
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = ""
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = ""
NEXT_PUBLIC_FIREBASE_APP_ID = ""
NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID = ""

# NOTE: provider secrets are intentionally absent from this file.
# Set them with `wrangler pages secret put <NAME>` or in the Pages dashboard:
#   GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY, BYTEZ_API_KEY,
#   GEMINI_MODEL, GROQ_MODEL, NVIDIA_MODEL, BYTEZ_MODEL,
#   ANON_SESSION_SECRET, FIREBASE_SERVICE_ACCOUNT_JSON
# Never commit real values.